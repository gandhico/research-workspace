[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
# Deliberately a different distribution name from the working-tree project
# (acc2027-gate-residual-control) so installing this package cannot silently
# replace a development checkout of that one.
name = "acc2027-advisor-package"
version = "2026.09.05"
description = "ACC 2027 CMG-PES advisor package: code, result tables, figures, and the manuscript"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
# Needed only to re-run simulations, not to read the shipped data.
sim = [
  "mujoco>=3.1,<4",
  "nengo>=4.1,<5",
  "PyYAML>=6,<7",
]

[project.scripts]
gra-run = "gra_control.cli:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]
include = ["gra_control*"]
