[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "acc2027-gate-residual-control"
version = "0.1.0"
description = "Reproducible coupled membrane-gate residual augmentation experiments across MuJoCo and Quanser platforms"
requires-python = ">=3.11"
dependencies = [
  "mujoco>=3.3,<4",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  "PyYAML>=6,<7",
]

[project.scripts]
gra-run = "gra_control.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
