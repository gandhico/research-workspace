[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "servo-pendulum-snn"
version = "0.1.0"
description = "Qube Servo 3 pendulum HyperLIF gate-state residual experiments."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
